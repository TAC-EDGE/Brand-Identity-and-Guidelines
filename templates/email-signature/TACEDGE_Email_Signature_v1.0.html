<!doctype html>
<!-- TACEDGE email signature v1.0.

     The optional compact brandmark uses the hosted asset so no attachment
     is added to every email. Delete that <td> for a text-only signature. -->
<html lang="en-NZ">
<head><meta charset="utf-8"><title>TACEDGE email signature v1.0</title></head>
<body style="background:#F7F5EC;padding:24px;font-family:Arial,sans-serif">

<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#242A1F;line-height:1.5">
  <tr>
    <td style="padding-right:14px;border-right:1px solid #D9D3C4;vertical-align:top">
      <img src="https://tacedge.github.io/Brand-Identity-and-Guidelines/assets/logos/app-icon/icon-192.png" alt="TACEDGE" width="44" height="44" style="display:block;border-radius:8px">
    </td>
    <td style="padding-left:14px;vertical-align:top">
      <div style="font-weight:bold;color:#242A1F">[Full name]</div>
      <div style="color:#5B6253">[Role] · TACEDGE</div>
      <div style="padding-top:6px;color:#5B6253">
        [+64 2X XXX XXXX] · <a href="mailto:[name]@tacedge.co.nz" style="color:#1A3219;text-decoration:none">[name]@tacedge.co.nz</a>
      </div>
      <div><a href="https://tacedge.co.nz" style="color:#1A3219;text-decoration:none">tacedge.co.nz</a> · New Zealand</div>
      <div style="padding-top:6px;font-size:11px;letter-spacing:1px;color:#646A5A">SHARED CLARITY. FOR GROUND-ENGINEERING DELIVERY.</div>
    </td>
  </tr>
</table>

</html>
